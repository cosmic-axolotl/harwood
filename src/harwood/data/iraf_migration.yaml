# IRAF -> harwood migration map
#
# Source: 'IRAF - inventario de funcionalidades e o que o torna referencia'
#   (iraf-community v2.18.2; Appendix A = tasks per package, section 3 = domains).
# Contract: 'harwood - decisoes de projeto', sections 2, 3.2 and 10.1.
#
# This file is the single source behind `harwood list`, the migration table in
# the docs, and the answer `harwood help <iraf-task>` gives for a task that
# harwood does not ship. Every IRAF name a user may type must appear here, so
# that the answer is never 'command not found'.
#
# domain scope   core   in the MVP's critical path
#                later  after the MVP, kept as a named target
#                split  part of the domain survives, the rest does not
#                out    not portable or not wanted (section 2)
#
# task status    available  shipped and complete
#                partial    shipped, with the gaps named in `note`
#                planned    will exist, `milestone` says when
#                replaced   the ecosystem already does it; `note` says what with
#                wontport   deliberately not portable; `note` says why
#
# Counts: 610 distinct task names across 52 packages. These are
# recomputed by tests/test_core.py, so a stale comment fails the suite.
#   available: 20, partial: 29, planned: 306, replaced: 94, wontport: 161
#   milestone mvp: 57 (31 of them running), later: 298
#
# `milestone` stays on a task after it is built, so that progress
# through the MVP can still be counted. Dropping it on completion --
# which is what happened until 2026-09-13 -- makes the question
# 'how much of the MVP is done' unanswerable from the map.

meta:
  iraf_version: 2.18.2
  source: iraf-community, menu (.men) files
  packages: 52
  distinct_tasks: 610

# Tasks harwood adds that IRAF has no counterpart for. They are kept apart
# from `tasks:` on purpose: that section is an inventory of IRAF and must stay
# an honest one, so nothing harwood invents may appear in it. A user migrating
# reads `tasks:` to find out what they lose; they read this to find out what
# they gain.
added:
  lineid: {pkg: onedspec, domain: spec-1d, status: available,
    note: "names the atom, ion or molecule behind each feature of a calibrated
           spectrum, from a curated catalogue. IRAF has no task for this -- the
           nearest thing is reading a line list by eye in splot."}

domains:
  io-formats:
    inventory: section 3.1
    scope: split
    tasks: 43
    rationale: "FITS/MEF is the working format (S2). The tape, plate-scanner and raster-conversion half is dropped."
  headers:
    inventory: section 3.2
    scope: core
    tasks: 28
    rationale: astropy.io.fits covers it; hselect is how a night of data gets organised.
  arithmetic:
    inventory: section 3.3
    scope: core
    tasks: 25
    rationale: "Cheap over numpy, used constantly, and imexpr has no Python equivalent as a task."
  filtering:
    inventory: section 3.4
    scope: later
    tasks: 21
    rationale: scipy.ndimage covers the filters; fit1d/imsurfit matter mainly as ccdproc internals.
  geometry:
    inventory: section 3.5
    scope: split
    tasks: 33
    rationale: "xyxymatch, imcentroid and imalign moved into the MVP: nothing that compares magnitudes across frames works without them, and the 1987 M92 frames drift 2 px between exposures and 5 px between filters. The rest of the domain -- geomap/geotran distortion fitting, mosaics, psfmatch -- stays after the MVP."
  combine:
    inventory: section 3.6
    scope: core
    tasks: 10
    rationale: One engine reused by 6+ tasks and the first compiled kernel (S7).
  ccd-reduction:
    inventory: section 3.7
    scope: core
    tasks: 42
    rationale: No reduction exists without it; ccdproc supplies the algorithms.
  masks:
    inventory: section 3.8
    scope: core
    tasks: 9
    rationale: Prerequisite for the SCI/VAR/DQ decision (S2).
  astrometry:
    inventory: section 3.9
    scope: later
    tasks: 36
    rationale: astropy.wcs plus astrometry.net cover the common path; ccmap-style interactive plate solutions do not.
  display:
    inventory: section 3.10
    scope: core
    tasks: 48
    rationale: S8 already decided and prototyped it; icfit lives here and half of spectroscopy depends on it.
  photometry:
    inventory: section 3.11
    scope: core
    tasks: 64
    rationale: photutils covers nearly all of it and the harwood tasks that exist today are here.
  spec-2d:
    inventory: section 3.12
    scope: later
    tasks: 30
    rationale: "Biggest gap in the Python ecosystem and biggest potential value, but it needs icfit and the database/ store first."
  spec-1d:
    inventory: section 3.13
    scope: later
    tasks: 36
    rationale: "Same as 3.12; specutils covers the containers, not the interactive calibration."
  spec-pipelines:
    inventory: section 3.14
    scope: later
    tasks: 20
    rationale: "In harwood these are YAML recipes and presets, not tasks (S3.2)."
  radial-velocity:
    inventory: section 3.15
    scope: later
    tasks: 6
    rationale: High value for stellar work and only 7 tasks; rvcorrect/setjd are trivial over astropy.
  time-observatory:
    inventory: section 3.16
    scope: core
    tasks: 6
    rationale: Trivial over astropy.time/coordinates and needed by every header stamp.
  instrument:
    inventory: section 3.17
    scope: later
    tasks: 7
    rationale: "psfmeasure and starfocus earn their place at the telescope, not in the MVP."
  synthetic-data:
    inventory: section 3.18
    scope: core
    tasks: 10
    rationale: The smoke test and the S7.5 backend tests need it; photutils.datasets supplies it.
  tables:
    inventory: section 3.19
    scope: out
    tasks: 37
    rationale: "astropy.table and ECSV replace the whole t* family; nothing here is ported."
  fitting-lists:
    inventory: section 3.20
    scope: later
    tasks: 20
    rationale: curfit/icfit is infrastructure and comes with 3.10; the list utilities are shell work.
  niches:
    inventory: section 3.21
    scope: out
    tasks: 25
    rationale: "vtel (solar), linpol, slitpic, binpairs, mkms: no user base to migrate."
  system:
    inventory: section 3.22
    scope: split
    tasks: 32
    rationale: "help/references are the harwood CLI itself; the file and device utilities are the shell's job."
  dev-tools:
    inventory: no section
    scope: out
    tasks: 14
    rationale: "mkpkg, xc, SPP tooling: replaced by Python packaging (S2)."
  legacy:
    inventory: no section
    scope: out
    tasks: 8
    rationale: obsolete/ and nobsolete/ packages.

