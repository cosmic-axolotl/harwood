# The whole suite on Linux and Windows, at the oldest and newest Python harwood supports, on every
# push and pull request. The IRAF tutorial's frames are not in the repository, and the tests that
# need them say so and are skipped.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's libraries, for the window's tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: harwood, as a user installs it, and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]" pytest hypothesis
      - name: doctor
        run: harwood doctor
      - name: the suite, against the installed package
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" -c "${{ github.workspace }}/pyproject.toml" -q -p no:cacheprovider -rfE
