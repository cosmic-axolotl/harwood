# The whole suite on Linux and Windows, at the oldest and newest Python harwood supports, on every
# push and pull request. The IRAF tutorial's frames are not in the repository, and the tests that
# need them say so and are skipped.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      # A crash in Qt or in compiled code stops the whole run with no test named: this
      # prints the stack of every thread when it happens
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's libraries, for the window's tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: harwood, as a user installs it, and what the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]" pytest hypothesis
      - name: doctor
        run: harwood doctor
      - name: what was installed
        run: python -m pip list
      - name: the suite, against the installed package
        working-directory: ${{ runner.temp }}
        # --capture=sys leaves the real stderr in place: a crash in Qt or in the C
        # library says why there, where with the default it went to a capture file
        # that died with the process
        run: python -m pytest "${{ github.workspace }}/tests" -c "${{ github.workspace }}/pyproject.toml" -v -p no:cacheprovider -rfE --capture=sys
