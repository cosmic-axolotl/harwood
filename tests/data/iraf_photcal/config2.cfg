# A configuration that exercises the language: a set equation, a constant,
# a delta, a derivative, weight and error equations with limits.
catalog

V             2
error(V)      3
B             4
error(B)      5

observations

TB            3
XB            4
mB            7
error(mB)     8
TV            10
XV            11
mV            14
error(mV)     15

transformation

fit   v1 = 25.0, v2 = -0.03, v3 = 0.18
const v4 = 0.01
fit   b1 = 2.10, b2 = -.06, b3 = 0.3
delta v2 = 0.05
set BV = B - V

VFIT : mV = V + v1 + v2 * BV + v3 * XV + v4 * XV * BV
derivative (VFIT, v3) = XV
weight (VFIT) = 1.0 / (0.0004 + 0.001 * XV)
error (VFIT) = 0.01 + 0.005 * (XV - 1.0)

BFIT : mB = B + b1 + b2 * BV + b3 * XB
weight (BFIT) = 1.0 / (0.0003 + abs (mB + 7.0) * 0.0001) min = 1500.0 max = 2500.0
error (BFIT) = 0.012
