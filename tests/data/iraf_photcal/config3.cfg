# A system evalfit can evaluate directly: the catalog magnitudes on the left,
# the observed ones on the right. A set equation, a colour on the left, and
# error equations.
catalog

V             2
error(V)      3
B             4
error(B)      5

observations

TB            3
XB            4
mB            7
error(mB)     8
TV            10
XV            11
mV            14
error(mV)     15

transformation

fit   v1 = -22.0, v2 = 0.05, v3 = -0.2
fit   b1 = -22.0, b2 = 0.05, b3 = -0.3
fit   c1 = 0.0, c2 = 1.0
set   CI = mB - mV

VFIT : V = mV + v1 + v2 * CI + v3 * XV
error (VFIT) = 0.01 + 0.005 * (XV - 1.0)

BFIT : B = mB + b1 + b2 * (mB - mV) + b3 * XB

CFIT : B - V = c1 + c2 * (mB - mV)
error (CFIT) = sqrt (0.01 ** 2 + 0.02 ** 2)
