[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harwood"
version = "0.2.0.dev0"
description = "Homogeneous Astronomical Reduction Workflows: Open, Observable, Documented."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Amanda da Costa Cabral" }]
keywords = ["astronomy", "photometry", "spectroscopy", "data-reduction", "iraf", "astropy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: BSD License",
]

# Deliberately few hard dependencies (S4): the weight of a reduction stack is
# real, but nothing here should need system configuration to install.
dependencies = [
  "numpy>=1.24",
  "astropy>=6.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ccd = ["ccdproc>=2.4", "astroscrappy>=1.2"]
phot = ["photutils>=1.13"]
gui = ["PySide6-Essentials>=6.6", "pyqtgraph>=0.13"]
fast = ["numba>=0.59"]
ds9 = ["pyds9>=1.8"]
all = ["harwood[ccd,phot,gui,fast]"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
harwood = "harwood.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harwood"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
